name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/numpy-cache

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y liblz4-dev

      - name: Install Poetry and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry auditwheel
          poetry --version
          auditwheel --version

      - name: Build package
        run: |
          poetry build

      - name: Repair Linux wheel
        run: |
          mkdir -p dist/repaired
          auditwheel repair dist/*.whl -w dist/repaired
          rm dist/*.whl
          mv dist/repaired/*.whl dist/
          rmdir dist/repaired

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
